services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/project_database
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  mongodb_data:
